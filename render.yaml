services:
  - type: web
    name: expenselens-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    rootDir: backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: expenselens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
    disk:
      name: upload-disk
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: expenselens-db
    databaseName: expenselens
    user: postgres
    plan: free
